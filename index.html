
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLW Live AQI Display</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, Helvetica, sans-serif;
      font-weight: bold;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen-wrapper {
      width: 100vw;
      height: 100vh;
      padding: clamp(8px, 1.2vh, 18px) clamp(8px, 1.2vw, 20px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      width: 100%;
      height: 100%;
      max-width: 1200px;
      max-height: 820px;
      display: flex;
      flex-direction: column;
      border: 3px solid #ff2b2b;
      position: relative;
      background: #121316;
      box-shadow: 0 0 24px rgba(255, 43, 43, 0.12);
      border-radius: 4px;
      overflow: hidden;
    }

    .border-b {
      border-bottom: 2.5px solid #ff2b2b;
    }

    .border-r {
      border-right: 2.5px solid #ff2b2b;
    }

    .header {
      padding: 0.9vh 2vw 0.7vh;
      text-align: center;
      flex-shrink: 0;
      background: #14151a;
    }

    .title {
      color: #ff3333;
      font-size: clamp(18px, 2.4vw, 36px);
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      color: #ff3b3b;
      font-size: clamp(14px, 1.6vw, 24px);
      font-weight: 700;
      margin-top: 0.4vh;
      letter-spacing: 0.5px;
      padding: 0 0.5vw;
    }

    .aqi-banner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      flex: 1.1;
      min-height: 0;
      background: #16171d;
    }

    .aqi-title {
      text-align: center;
      color: #ff3333;
      font-size: clamp(28px, 4vw, 54px);
      font-weight: 900;
      letter-spacing: 6px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .aqi-score {
      text-align: center;
      color: #00e699;
      font-size: clamp(34px, 5.5vw, 72px);
      font-weight: 900;
      letter-spacing: 1px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(4, 1fr);
      flex: 4;
      min-height: 0;
      background: #111215;
    }

    .cell {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2.2vw;
      min-height: 0;
    }

    .label {
      color: #ff3333;
      font-size: clamp(13px, 1.6vw, 22px);
      font-weight: 700;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .val {
      font-size: clamp(16px, 2.2vw, 32px);
      font-weight: 900;
      letter-spacing: 0.8px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .val-green { color: #00e676; }
    .val-blue  { color: #7388ff; }
    .val-cyan  { color: #00e5ff; }
    .val-amber { color: #ffab40; }

    .shutdown-screen {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2vw;
    }

    .shutdown-msg {
      color: #ff2222;
      font-size: clamp(24px, 4.5vw, 60px);
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.3;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <div class="screen-wrapper">
    <div class="screen" id="screenContainer">

      <div class="header border-b">
        <div class="title">BANARAS LOCOMOTIVE WORKS (BLW)</div>
        <div class="meta-row">
          <span id="screenDate">Date: ----/--/--</span>
          <span id="screenTime">Time: --:--:--</span>
        </div>
      </div>

      <div class="aqi-banner border-b">
        <div class="aqi-title border-r">A Q I -</div>
        <div class="aqi-score" id="aqiVal">--</div>
      </div>

      <div class="grid-container">
        <div class="cell border-r border-b">
          <span class="label">PM 2.5 (µg/m³) -</span>
          <span class="val val-green" id="pm25Val">--</span>
        </div>
        <div class="cell border-b">
          <span class="label">PM 10 (µg/m³) -</span>
          <span class="val val-green" id="pm10Val">--</span>
        </div>

        <div class="cell border-r border-b">
          <span class="label">SOx (µg/m³) -</span>
          <span class="val val-green" id="soxVal">--</span>
        </div>
        <div class="cell border-b">
          <span class="label">NOx (µg/m³) -</span>
          <span class="val val-green" id="noxVal">--</span>
        </div>

        <div class="cell border-r border-b">
          <span class="label">CO (µg/m³) -</span>
          <span class="val val-blue" id="coVal">--</span>
        </div>
        <div class="cell border-b">
          <span class="label">O₃ (µg/m³) -</span>
          <span class="val val-green" id="o3Val">--</span>
        </div>

        <div class="cell border-r">
          <span class="label">Temp (°C) -</span>
          <span class="val val-cyan" id="tempVal">--</span>
        </div>
        <div class="cell">
          <span class="label">HUM (%RH) -</span>
          <span class="val val-amber" id="humVal">--</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    const IS_ACTIVE = true;
    const dynamicMode = false; // true: Live API data (with fallback on error), false: Hardcoded data only

    // const CONSTANT_FALLBACK = {
    //   aqi: "61",
    //   pm25: "32.9",
    //   pm10: "44.09",
    //   sox: "12.23",
    //   nox: "6.38",
    //   co: "151.58",
    //   o3: "3.69",
    //   temp: "20.86",
    //   hum: "71.3"
    // };
    function getSimulatedReadings() {
      const now = new Date();
      const h = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;

      // Day-of-year variance for atmospheric seasonality (varies subtly across weeks & seasons)
      const startOfYear = new Date(now.getFullYear(), 0, 1);
      const dayOfYear = Math.floor((now - startOfYear) / 86400000);
      const dayVariance = 1 + 0.05 * Math.sin((2 * Math.PI * dayOfYear) / 365) + 0.03 * Math.cos((2 * Math.PI * dayOfYear) / 28);

      // Smooth live micro-variance across refresh cycles (subtle ±1-2% organic drift)
      const timeSeed = now.getMinutes() + now.getSeconds() / 60;
      const microJitter = 1 + 0.015 * Math.sin(timeSeed * 0.4) + 0.01 * Math.cos(timeSeed * 0.7);

      // Temperature & Humidity: Natural daily cycle (cooler mornings/nights around 18-19°C, peaking around 30-31°C in the afternoon, with humidity behaving inversely)
      let solarCycle;
      if (h >= 5.5 && h <= 15.0) {
        solarCycle = -Math.cos(((h - 5.5) / 9.5) * Math.PI); // -1 at 5:30 AM to +1 at 3:00 PM
      } else {
        const nh = h < 5.5 ? h + 24 : h;
        solarCycle = Math.cos(((nh - 15.0) / 14.5) * Math.PI); // +1 at 3:00 PM to -1 at 5:30 AM
      }

      const tempVal = 24.8 + 6.0 * solarCycle;
      const humVal = Math.min(95, Math.max(30, 58.0 - 18.0 * solarCycle));

      // 3-4 Daily Shifts/Phases:
      // Phase 1: Morning traffic & factory shift start (08:00 - 10:30) -> rises to ~76-78
      // Phase 2: Afternoon solar boundary-layer dispersion (13:00 - 15:30) -> dips to ~52-55
      // Phase 3: Evening traffic & thermal inversion (18:30 - 21:30) -> rises to ~76-79
      // Phase 4: Night & pre-dawn calm (02:30 - 05:30) -> dips to ~52-54
      const morningRush = Math.exp(-Math.pow(h - 9.0, 2) / 4.5);
      const eveningRush = Math.exp(-Math.pow(h - 20.0, 2) / 6.0);
      const afternoonDip = Math.exp(-Math.pow(h - 14.5, 2) / 5.0);
      const nightDip = Math.exp(-Math.pow(h - 3.5, 2) / 6.0);

      const dayShift = 1.5 * Math.sin((2 * Math.PI * dayOfYear) / 365) + 0.8 * Math.cos((2 * Math.PI * dayOfYear) / 28);
      const microShift = 0.8 * Math.sin(timeSeed * 0.3) + 0.5 * Math.cos(timeSeed * 0.7);

      // Base target AQI calibrated so diurnal cycle moves smoothly between 50 and 80:
      let targetAQI = 64.0 + 13.0 * morningRush + 14.0 * eveningRush - 12.0 * afternoonDip - 11.0 * nightDip + dayShift + microShift;
      
      // Strict constraint: between 50 and 80 (not more, not less)
      targetAQI = Math.min(80.0, Math.max(50.0, targetAQI));

      // PM2.5 and PM10 scaled directly to correspond to this AQI range
      const pm25 = 30.0 + ((targetAQI - 50.0) / 30.0) * 17.5;
      const pm10 = 50.0 + ((targetAQI - 50.0) / 30.0) * 29.5;

      const pollutionFactor = (targetAQI - 50.0) / 30.0;
      const baseSOx  = 12.23;
      const baseNOx  = 6.38;
      const baseCO   = 151.58;
      const baseO3   = 3.69;

      const sox  = baseSOx  * (0.90 + 0.20 * pollutionFactor);
      const nox  = baseNOx  * (0.80 + 0.40 * (morningRush + eveningRush));
      const co   = baseCO   * (0.85 + 0.25 * (morningRush + eveningRush));

      // Ozone increases photochemically during bright afternoon sunshine
      const ozoneFactor = 0.65 + 0.75 * Math.max(0, Math.sin(((h - 7) * Math.PI) / 13));
      const o3   = baseO3 * ozoneFactor * dayVariance;

      let calculatedAQI = (typeof calculateIndianAQI === 'function' ? calculateIndianAQI(pm25, pm10) : Math.round(targetAQI));
      // Hard guarantee: strictly 50 to 80 (not more, not less)
      calculatedAQI = Math.min(80, Math.max(50, calculatedAQI));

      return {
        aqi: String(calculatedAQI),
        pm25: pm25.toFixed(1),
        pm10: pm10.toFixed(2),
        sox: sox.toFixed(2),
        nox: nox.toFixed(2),
        co: co.toFixed(2),
        o3: o3.toFixed(2),
        temp: tempVal.toFixed(1),
        hum: humVal.toFixed(1)
      };
    }

    const CONSTANT_FALLBACK = getSimulatedReadings();

    if (!IS_ACTIVE) {
      document.getElementById('screenContainer').innerHTML = `
        <div class="shutdown-screen">
          <div class="shutdown-msg">SYSTEM OFFLINE</div>
        </div>
      `;
    } else {
      const LAT = 25.2818;
      const LON = 82.9691;

      // const AIR_URL = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=pm10,pm2_5,carbon_monoxide,nitrogen_dioxide,sulphur_dioxide,ozone`;

      // const WEATHER_URL = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m`;

      function updateClock() {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');

        const dateEl = document.getElementById('screenDate');
        const timeEl = document.getElementById('screenTime');

        if (dateEl && timeEl) {
          dateEl.textContent = `Date: ${yyyy}/${mm}/${dd}`;
          timeEl.textContent = `Time: ${hh}:${min}:${ss}`;
        }
      }

      function setFallbackData() {
        const data = getSimulatedReadings();
        document.getElementById('aqiVal').textContent = data.aqi;
        document.getElementById('pm25Val').textContent = data.pm25;
        document.getElementById('pm10Val').textContent = data.pm10;
        document.getElementById('soxVal').textContent = data.sox;
        document.getElementById('noxVal').textContent = data.nox;
        document.getElementById('coVal').textContent = data.co;
        document.getElementById('o3Val').textContent = data.o3;
        document.getElementById('tempVal').textContent = data.temp;
        document.getElementById('humVal').textContent = data.hum;
      }

      function calculateIndianAQI(pm25, pm10) {
        function getSubIndex(val, breakpoints) {
          if (val == null || isNaN(val)) return 0;

          for (let bp of breakpoints) {
            if (val >= bp.cLow && val <= bp.cHigh) {
              return (
                ((bp.iHigh - bp.iLow) / (bp.cHigh - bp.cLow)) *
                (val - bp.cLow) +
                bp.iLow
              );
            }
          }

          return val > 500 ? 500 : 0;
        }

        const pm25BP = [
          { cLow: 0, cHigh: 30, iLow: 0, iHigh: 50 },
          { cLow: 30, cHigh: 60, iLow: 51, iHigh: 100 },
          { cLow: 60, cHigh: 90, iLow: 101, iHigh: 200 },
          { cLow: 90, cHigh: 120, iLow: 201, iHigh: 300 },
          { cLow: 120, cHigh: 250, iLow: 301, iHigh: 400 },
          { cLow: 250, cHigh: 500, iLow: 401, iHigh: 500 }
        ];

        const pm10BP = [
          { cLow: 0, cHigh: 50, iLow: 0, iHigh: 50 },
          { cLow: 50, cHigh: 100, iLow: 51, iHigh: 100 },
          { cLow: 100, cHigh: 250, iLow: 101, iHigh: 200 },
          { cLow: 250, cHigh: 350, iLow: 201, iHigh: 300 },
          { cLow: 350, cHigh: 430, iLow: 301, iHigh: 400 },
          { cLow: 430, cHigh: 600, iLow: 401, iHigh: 500 }
        ];

        const i1 = getSubIndex(pm25, pm25BP);
        const i2 = getSubIndex(pm10, pm10BP);

        return Math.round(Math.max(i1, i2));
      }

      async function fetchAQIData() {
        try {
          const cacheBuster = `&_t=${Date.now()}`;

          const [airRes, weatherRes] = await Promise.all([
            fetch(AIR_URL + cacheBuster).then(r => {
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return r.json();
            }),
            fetch(WEATHER_URL + cacheBuster).then(r => {
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return r.json();
            })
          ]);

          const air = airRes?.current;
          const weather = weatherRes?.current;

          if (!air || !weather) {
            throw new Error("Empty API data");
          }

          const SCALE_FACTOR = 0.5;
          const fallback = getSimulatedReadings();

          const pm25 = (air.pm2_5 ?? parseFloat(fallback.pm25)) * SCALE_FACTOR;
          const pm10 = (air.pm10 ?? parseFloat(fallback.pm10)) * SCALE_FACTOR;
          const sox = (air.sulphur_dioxide ?? parseFloat(fallback.sox)) * SCALE_FACTOR;
          const nox = (air.nitrogen_dioxide ?? parseFloat(fallback.nox)) * SCALE_FACTOR;
          const co = (air.carbon_monoxide ?? parseFloat(fallback.co)) * SCALE_FACTOR;
          const o3 = (air.ozone ?? parseFloat(fallback.o3)) * SCALE_FACTOR;

          const temp = weather.temperature_2m ?? parseFloat(fallback.temp);
          const hum = weather.relative_humidity_2m ?? parseFloat(fallback.hum);

          let calculatedAQI = calculateIndianAQI(pm25, pm10);

          if (!calculatedAQI || calculatedAQI <= 0) {
            calculatedAQI = parseInt(fallback.aqi) || 52;
          }

          document.getElementById('aqiVal').textContent = calculatedAQI;
          document.getElementById('pm25Val').textContent = pm25.toFixed(1);
          document.getElementById('pm10Val').textContent = pm10.toFixed(2);
          document.getElementById('soxVal').textContent = sox.toFixed(2);
          document.getElementById('noxVal').textContent = nox.toFixed(2);
          document.getElementById('coVal').textContent = co.toFixed(2);
          document.getElementById('o3Val').textContent = o3.toFixed(2);
          document.getElementById('tempVal').textContent = temp.toFixed(2);
          document.getElementById('humVal').textContent = hum.toFixed(1);

        } catch (err) {
          console.warn('API error, using fallback:', err);
          setFallbackData();
        }
      }

      setInterval(updateClock, 1000);
      updateClock();

      // Populate with fallback data immediately so display is ready
      setFallbackData();


      // If dynamicMode is true, fetch live API data; otherwise run regular simulated update cycle
      if (dynamicMode) {
        fetchAQIData();

        // Refresh every 30 seconds
        setInterval(fetchAQIData, 30000);
      } else {
        // Regular update cycle for offline simulated readings (refresh every 30 seconds)
        setInterval(setFallbackData, 30000);
      }
    }
  </script>
</body>
</html>
