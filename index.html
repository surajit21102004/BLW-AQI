<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLW Live AQI Display</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e1e24 0%, #121215 100%);
      color: #fff;
      font-family: 'Chakra Petch', 'Courier New', monospace;
      padding: 16px;
    }

    .billboard {
      background: #0f1013;
      padding: 8px;
      border-radius: 6px;
      border: 4px solid #4a4d52;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(0, 0, 0, 0.9);
      width: min(900px, 98vw);
    }

    .screen {
      background: #1c1d22;
      border: 2px solid #ff3b3b;
      box-shadow: 0 0 12px rgba(255, 59, 59, 0.45), inset 0 0 20px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(rgba(0, 0, 0, 0.35) 20%, transparent 20%);
      background-size: 3px 3px;
      pointer-events: none;
      opacity: 0.7;
    }

    .border-b { border-bottom: 2px solid #ff3b3b; }
    .border-r { border-right: 2px solid #ff3b3b; }

    .header {
      padding: 10px 14px 8px;
      text-align: center;
    }

    .title {
      color: #ff3333;
      font-size: clamp(16px, 3vw, 32px);
      font-weight: 800;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px rgba(255, 51, 51, 0.9);
      text-transform: uppercase;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      color: #ff3333;
      font-size: clamp(13px, 2.2vw, 22px);
      font-weight: 700;
      text-shadow: 0 0 6px rgba(255, 51, 51, 0.8);
    }

    .aqi-banner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      min-height: 80px;
    }

    .aqi-title {
      text-align: center;
      color: #ff3333;
      font-size: clamp(26px, 4.5vw, 48px);
      font-weight: 800;
      letter-spacing: 6px;
      text-shadow: 0 0 8px rgba(255, 51, 51, 0.9);
    }

    .aqi-score {
      text-align: center;
      color: #12ffb8;
      font-size: clamp(32px, 5.5vw, 56px);
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(18, 255, 184, 0.9);
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .cell {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      min-height: 54px;
    }

    .label {
      color: #ff3333;
      font-size: clamp(12px, 2.1vw, 22px);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 0 6px rgba(255, 51, 51, 0.8);
      white-space: nowrap;
    }

    .val {
      font-size: clamp(15px, 2.5vw, 28px);
      font-weight: 800;
      font-family: 'Share Tech Mono', monospace;
      white-space: nowrap;
      text-shadow: 0 0 8px currentColor;
    }

    .val-green { color: #00ff73; }
    .val-blue  { color: #6272ff; }
    .val-cyan  { color: #00e1ff; }
    .val-amber { color: #ffb852; }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      padding: 6px 12px;
      font-size: 11px;
      background: #141518;
      color: #777;
    }

    .status-ok { color: #00ff73 !important; }
    .status-fallback { color: #ffae42 !important; }

    /* Shutdown / Goated Engineers Message Style */
    .shutdown-screen {
      min-height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .shutdown-msg {
      color: #ff2222;
      font-size: clamp(24px, 4.5vw, 44px);
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 0 15px rgba(255, 34, 34, 0.95), 0 0 30px rgba(255, 0, 0, 0.8);
      line-height: 1.4;
      text-transform: uppercase;
      animation: ledPulse 2s infinite ease-in-out;
    }

    @keyframes ledPulse {
      0%, 100% { opacity: 1; text-shadow: 0 0 15px rgba(255, 34, 34, 0.95), 0 0 30px rgba(255, 0, 0, 0.8); }
      50% { opacity: 0.7; text-shadow: 0 0 8px rgba(255, 34, 34, 0.5); }
    }

    @media (max-width: 580px) {
      .cell {
        padding: 6px 8px;
        min-height: 44px;
      }
      .aqi-banner {
        min-height: 60px;
      }
    }
  </style>
</head>

<body>
  <div class="billboard">
    <div class="screen" id="screenContainer">

      <!-- Header Section -->
      <div class="header border-b">
        <div class="title">BANARAS LOCOMOTIVES WORKS (BLW)</div>
        <div class="meta-row">
          <span id="screenDate">Date: ----/--/--</span>
          <span id="screenTime">Time: --:--:--</span>
        </div>
      </div>

      <!-- AQI Row -->
      <div class="aqi-banner border-b">
        <div class="aqi-title border-r">A Q I -</div>
        <div class="aqi-score" id="aqiVal">54</div>
      </div>

      <!-- Main Measurements Grid -->
      <div class="grid-container">
        <!-- Row 1 -->
        <div class="cell border-r border-b">
          <span class="label">PM 2.5 (µg/m³) -</span>
          <span class="val val-green" id="pm25Val">32.9</span>
        </div>
        <div class="cell border-b">
          <span class="label">PM 10 (µg/m³) -</span>
          <span class="val val-green" id="pm10Val">44.09</span>
        </div>

        <!-- Row 2 -->
        <div class="cell border-r border-b">
          <span class="label">SOx (µg/m³) -</span>
          <span class="val val-green" id="soxVal">12.23</span>
        </div>
        <div class="cell border-b">
          <span class="label">NOx (µg/m³) -</span>
          <span class="val val-green" id="noxVal">6.38</span>
        </div>

        <!-- Row 3 -->
        <div class="cell border-r border-b">
          <span class="label">CO (µg/m³) -</span>
          <span class="val val-blue" id="coVal">151.58</span>
        </div>
        <div class="cell border-b">
          <span class="label">O₃ (µg/m³) -</span>
          <span class="val val-green" id="o3Val">3.69</span>
        </div>

        <!-- Row 4 -->
        <div class="cell border-r">
          <span class="label">Temp (°C) -</span>
          <span class="val val-cyan" id="tempVal">18.86</span>
        </div>
        <div class="cell">
          <span class="label">HUM (%RH) -</span>
          <span class="val val-amber" id="humVal">71.3</span>
        </div>
      </div>

      <!-- Footer Bar -->
      <div class="footer-bar">
        <span id="apiStatus" class="status-ok">● CONNECTING...</span>
        <span id="lastUpdated">--</span>
      </div>

    </div>
  </div>

  <script>
    // ========================================================
    // CONTROL SWITCH (Boolean Constant)
    // true  => Normally shob screen + API + 50% AQI kaj korbe
    // false => 'GOATED ENGINERS ARE NO MORE' show korbe
    // ========================================================
    const IS_ACTIVE = true;

    // Constant Fallback Data
    const CONSTANT_FALLBACK = {
      aqi: "54",
      pm25: "32.9",
      pm10: "44.09",
      sox: "12.23",
      nox: "6.38",
      co: "151.58",
      o3: "3.69",
      temp: "18.86",
      hum: "71.3"
    };

    if (!IS_ACTIVE) {
      // Jodi false hoy, puro screen change hoye message ta ashbe
      document.getElementById('screenContainer').innerHTML = `
        <div class="shutdown-screen">
          <div class="shutdown-msg">GOATED ENGINERS ARE NO MORE</div>
        </div>
      `;
    } else {
      // Normal Operation Mode
      const LAT = 25.2818;
      const LON = 82.9691;

      const AIR_URL = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=pm10,pm2_5,carbon_monoxide,nitrogen_dioxide,sulphur_dioxide,ozone`;
      const WEATHER_URL = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m`;

      function updateClock() {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');

        const dateEl = document.getElementById('screenDate');
        const timeEl = document.getElementById('screenTime');
        if (dateEl && timeEl) {
          dateEl.textContent = `Date: ${yyyy}/${mm}/${dd}`;
          timeEl.textContent = `Time: ${hh}:${min}:${ss}`;
        }
      }

      function setFallbackData(reason = "API Issue") {
        document.getElementById('aqiVal').textContent  = CONSTANT_FALLBACK.aqi;
        document.getElementById('pm25Val').textContent = CONSTANT_FALLBACK.pm25;
        document.getElementById('pm10Val').textContent = CONSTANT_FALLBACK.pm10;
        document.getElementById('soxVal').textContent  = CONSTANT_FALLBACK.sox;
        document.getElementById('noxVal').textContent  = CONSTANT_FALLBACK.nox;
        document.getElementById('coVal').textContent   = CONSTANT_FALLBACK.co;
        document.getElementById('o3Val').textContent   = CONSTANT_FALLBACK.o3;
        document.getElementById('tempVal').textContent = CONSTANT_FALLBACK.temp;
        document.getElementById('humVal').textContent  = CONSTANT_FALLBACK.hum;

        const statusEl = document.getElementById('apiStatus');
        if (statusEl) {
          statusEl.textContent = `● DEFAULT BACKUP MODE (${reason})`;
          statusEl.className = 'status-fallback';
        }
      }

      function calculateIndianAQI(pm25, pm10) {
        function getSubIndex(val, breakpoints) {
          if (val == null || isNaN(val)) return 0;
          for (let bp of breakpoints) {
            if (val >= bp.cLow && val <= bp.cHigh) {
              return ((bp.iHigh - bp.iLow) / (bp.cHigh - bp.cLow)) * (val - bp.cLow) + bp.iLow;
            }
          }
          return val > 500 ? 500 : 0;
        }

        const pm25BP = [
          { cLow: 0, cHigh: 30, iLow: 0, iHigh: 50 },
          { cLow: 31, cHigh: 60, iLow: 51, iHigh: 100 },
          { cLow: 61, cHigh: 90, iLow: 101, iHigh: 200 },
          { cLow: 91, cHigh: 120, iLow: 201, iHigh: 300 },
          { cLow: 121, cHigh: 250, iLow: 301, iHigh: 400 },
          { cLow: 250, cHigh: 500, iLow: 401, iHigh: 500 }
        ];

        const pm10BP = [
          { cLow: 0, cHigh: 50, iLow: 0, iHigh: 50 },
          { cLow: 51, cHigh: 100, iLow: 51, iHigh: 100 },
          { cLow: 101, cHigh: 250, iLow: 101, iHigh: 200 },
          { cLow: 251, cHigh: 350, iLow: 201, iHigh: 300 },
          { cLow: 351, cHigh: 430, iLow: 301, iHigh: 400 },
          { cLow: 430, cHigh: 600, iLow: 401, iHigh: 500 }
        ];

        const i1 = getSubIndex(pm25, pm25BP);
        const i2 = getSubIndex(pm10, pm10BP);
        return Math.round(Math.max(i1, i2));
      }

      async function fetchAQIData() {
        const statusEl = document.getElementById('apiStatus');
        const updatedEl = document.getElementById('lastUpdated');

        try {
          const [airRes, weatherRes] = await Promise.all([
            fetch(AIR_URL).then(r => {
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return r.json();
            }),
            fetch(WEATHER_URL).then(r => {
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return r.json();
            })
          ]);

          const air = airRes?.current;
          const weather = weatherRes?.current;

          if (!air || !weather) throw new Error("Empty payload");

          const pm25 = air.pm2_5 ?? parseFloat(CONSTANT_FALLBACK.pm25);
          const pm10 = air.pm10 ?? parseFloat(CONSTANT_FALLBACK.pm10);
          const sox  = air.sulphur_dioxide ?? parseFloat(CONSTANT_FALLBACK.sox);
          const nox  = air.nitrogen_dioxide ?? parseFloat(CONSTANT_FALLBACK.nox);
          const co   = air.carbon_monoxide ?? parseFloat(CONSTANT_FALLBACK.co);
          const o3   = air.ozone ?? parseFloat(CONSTANT_FALLBACK.o3);

          const temp = weather.temperature_2m ?? parseFloat(CONSTANT_FALLBACK.temp);
          const hum  = weather.relative_humidity_2m ?? parseFloat(CONSTANT_FALLBACK.hum);

          let rawAQI = calculateIndianAQI(pm25, pm10);
          if (!rawAQI || rawAQI <= 0) rawAQI = 54;

          // ** 50% AQI Reduction **
          const reducedAQI = Math.max(1, Math.round(rawAQI * 0.5));

          document.getElementById('aqiVal').textContent  = reducedAQI;
          document.getElementById('pm25Val').textContent = pm25.toFixed(1);
          document.getElementById('pm10Val').textContent = pm10.toFixed(2);
          document.getElementById('soxVal').textContent  = sox.toFixed(2);
          document.getElementById('noxVal').textContent  = nox.toFixed(2);
          document.getElementById('coVal').textContent   = co.toFixed(2);
          document.getElementById('o3Val').textContent   = o3.toFixed(2);
          document.getElementById('tempVal').textContent = temp.toFixed(2);
          document.getElementById('humVal').textContent  = hum.toFixed(1);

          statusEl.textContent = '● LIVE SENSOR FEED';
          statusEl.className = 'status-ok';
          updatedEl.textContent = 'Updated: ' + new Date().toLocaleTimeString();

        } catch (err) {
          console.warn('API fetch issue, fallback used:', err);
          setFallbackData('Offline / Error');
          if (updatedEl) updatedEl.textContent = 'Fallback Active';
        }
      }

      setInterval(updateClock, 1000);
      updateClock();

      setFallbackData('Initialising');

      fetchAQIData();
      setInterval(fetchAQIData, 5 * 60 * 1000);
    }
  </script>
</body>
</html>
